name: Bright Solar QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Astro diagnostics
        run: npm run check

      - name: Production build
        run: npm run build

      - name: SEO gate
        run: npm run qa:seo

      - name: Privacy and claim gate
        run: npm run qa:privacy
